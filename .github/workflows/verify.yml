name: KindWorks verification

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run assets:validate
      - run: pnpm run assets:validate:adversarial
      - run: pnpm run assets:legacy-audit
      - run: pnpm test
      - run: pnpm run build
      - run: pnpm run visual:compare
      - run: pnpm run visual:reference:check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-comparison-evidence
          path: artifacts/visual-regression
