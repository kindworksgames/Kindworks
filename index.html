<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1f382a" />
    <title>Kindworks</title>
  </head>
  <body>
    <main class="game-shell" aria-label="Kindworks Phaser game">
      <div id="game"></div>
      <section class="town-hud" aria-label="Town information">
        <div class="town-title"><strong>KINDWORKS</strong><span id="location-status">Willowmere</span></div>
        <div class="hud-actions">
          <button id="save-status-button" class="save-status-button" type="button" data-status="new">Save not started</button>
          <div class="milestone-badge">PHASER TOWN · MILESTONE 3</div>
        </div>
      </section>
      <section id="interaction-prompt" class="interaction-prompt hidden" aria-label="Nearby interaction" aria-hidden="true">
        <span class="interaction-key" aria-hidden="true">E</span>
        <button id="interaction-action" type="button">✨ Interact</button>
        <small id="interaction-detail">Press E or Space</small>
      </section>
      <section class="touch-controls" aria-label="Movement controls">
        <button type="button" class="move-up" data-move="up" aria-label="Walk up">▲</button>
        <button type="button" class="move-left" data-move="left" aria-label="Walk left">◀</button>
        <button type="button" class="move-down" data-move="down" aria-label="Walk down">▼</button>
        <button type="button" class="move-right" data-move="right" aria-label="Walk right">▶</button>
      </section>
      <section class="zoom-controls" aria-label="Map zoom controls">
        <button id="zoom-in" type="button" aria-label="Zoom in">＋</button>
        <button id="zoom-out" type="button" aria-label="Zoom out">−</button>
      </section>
      <p id="control-hint" class="control-hint">Arrow keys or WASD to walk · E or Space to interact · Shift to run</p>
      <section id="save-panel" class="save-panel hidden" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="save-panel-title" aria-describedby="save-panel-message">
        <div class="save-panel-card">
          <div class="save-panel-icon" aria-hidden="true">🛟</div>
          <div>
            <p class="save-panel-eyebrow">MILESTONE 3 · SAFE SAVES</p>
            <h2 id="save-panel-title">Safe saves are ready</h2>
          </div>
          <button id="save-panel-close" class="save-panel-close" type="button" aria-label="Close save information">✕</button>
          <p id="save-panel-message">The new Phaser save area is separate from the original HTML game.</p>
          <p id="save-panel-details" class="save-panel-details">No original save data will be overwritten.</p>
          <div class="save-panel-actions">
            <button id="save-panel-primary" type="button">Create new Phaser save</button>
          </div>
        </div>
      </section>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
